<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FRONTHYRE · Something big is arriving</title>
  <style>
    /* ---------- RESET & BASE ---------- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      font-family: "Inter", "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      color: #1f2a3a;
      /* warm, optimistic gradient background */
      background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 40%, #e8f0fb 100%);
      background-attachment: fixed;
      position: relative;
      overflow-x: hidden;
    }

    /* soft ambient shapes for positive, airy feel */
    body::before,
    body::after {
      content: "";
      position: fixed;
      border-radius: 50%;
      filter: blur(100px);
      z-index: 0;
      pointer-events: none;
    }

    body::before {
      width: 500px;
      height: 500px;
      background: rgba(255, 214, 165, 0.35);
      top: -180px;
      left: -140px;
    }

    body::after {
      width: 600px;
      height: 600px;
      background: rgba(165, 214, 255, 0.35);
      bottom: -220px;
      right: -180px;
    }

    /* ---------- MAIN CARD ---------- */
    .hero {
      position: relative;
      z-index: 1;
      max-width: 960px;
      width: 100%;
      text-align: center;
      padding: 4rem 2.5rem 3.5rem;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: 2.5rem;
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow:
        0 25px 60px -20px rgba(120, 140, 170, 0.25),
        0 8px 25px -10px rgba(120, 140, 170, 0.15);
      animation: floatIn 0.9s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* ---------- FRONTHYRE TITLE (clean, positive, no glow) ---------- */
    .big-title {
      font-size: clamp(3.2rem, 13vw, 6.8rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1;
      text-transform: uppercase;
      color: #1a2b4a;
      margin-bottom: 0.4rem;
      /* subtle warm gradient text instead of glow */
      background: linear-gradient(135deg, #1a2b4a 0%, #2e4a7a 50%, #1a2b4a 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* friendly decorative line */
    .big-title::after {
      content: "";
      display: block;
      width: 90px;
      height: 5px;
      margin: 1.4rem auto 1.2rem;
      border-radius: 10px;
      background: linear-gradient(90deg, #ffb347, #ffcc70, #7ec8e3, #a8d8ff);
      box-shadow: 0 3px 10px rgba(255, 180, 90, 0.25);
    }

    /* ---------- TAGLINE ---------- */
    .tagline {
      font-size: clamp(0.95rem, 3.2vw, 1.3rem);
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #5a6b85;
      margin-bottom: 2.6rem;
      display: inline-block;
      padding: 0 1rem;
    }

    /* ---------- IN PROGRESS SECTION ---------- */
    .progress-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.2rem;
      padding: 0.5rem 0 0;
    }

    /* gentle "in progress" pill */
    .arriving-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: clamp(0.75rem, 2.6vw, 0.95rem);
      font-weight: 600;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #3f6a5a;
      background: linear-gradient(135deg, #e6f7ef, #d7f0e6);
      padding: 0.7rem 1.8rem;
      border-radius: 60px;
      border: 1px solid rgba(110, 180, 150, 0.35);
      box-shadow: 0 4px 15px rgba(110, 180, 150, 0.12);
      position: relative;
    }

    /* cheerful pulsing dot */
    .arriving-badge::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #3fbf7f;
      box-shadow: 0 0 0 0 rgba(63, 191, 127, 0.6);
      animation: pulseDot 1.8s infinite;
    }

    /* BIG positive message */
    .big-message {
      font-size: clamp(1.8rem, 7.5vw, 3.4rem);
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: -0.01em;
      text-transform: uppercase;
      color: #2b4a7a;
      /* optimistic gradient */
      background: linear-gradient(115deg, #2b4a7a, #4a7ab5, #ff9f4a);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.2rem;
    }

    /* ---------- PROGRESS BAR (bright & friendly) ---------- */
    .progress-track {
      width: 100%;
      max-width: 440px;
      height: 10px;
      background: #e9eef5;
      border-radius: 20px;
      margin: 0.8rem 0 0.2rem;
      overflow: hidden;
      box-shadow: inset 0 2px 5px rgba(100, 120, 150, 0.08);
    }

    .progress-fill {
      width: 72%;
      height: 100%;
      border-radius: 20px;
      background: linear-gradient(90deg, #ffb347, #ffcc70, #7ec8e3, #a8d8ff);
      background-size: 200% 100%;
      animation: gradientShift 3s ease infinite;
      position: relative;
    }

    /* soft moving shine */
    .progress-fill::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(255, 255, 255, 0.55) 50%,
        transparent 100%
      );
      transform: translateX(-100%);
      animation: shine 2.4s infinite;
    }

    .progress-label {
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #8798b0;
      margin-top: 0.4rem;
    }

    /* ---------- META FOOTNOTE ---------- */
    .meta-note {
      margin-top: 2.8rem;
      padding-top: 1.8rem;
      border-top: 1px solid rgba(120, 140, 170, 0.15);
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 1.2rem 2.4rem;
      font-size: clamp(0.7rem, 2.2vw, 0.82rem);
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #7d8fa8;
    }

    .meta-note span {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .meta-note span::before {
      content: "✦";
      font-size: 0.75rem;
      color: #ff9f4a;
    }

    /* ---------- ANIMATIONS ---------- */
    @keyframes floatIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulseDot {
      0% {
        box-shadow: 0 0 0 0 rgba(63, 191, 127, 0.5);
      }
      70% {
        box-shadow: 0 0 0 10px rgba(63, 191, 127, 0);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(63, 191, 127, 0);
      }
    }

    @keyframes gradientShift {
      0% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
      100% {
        background-position: 0% 50%;
      }
    }

    @keyframes shine {
      0% {
        transform: translateX(-100%);
      }
      60%,
      100% {
        transform: translateX(100%);
      }
    }

    /* ---------- RESPONSIVE ---------- */
    @media (max-width: 560px) {
      .hero {
        padding: 2.8rem 1.3rem 2.5rem;
        border-radius: 2rem;
      }
      .big-title {
        font-size: clamp(2.6rem, 13vw, 3.6rem);
      }
      .big-title::after {
        width: 70px;
        height: 4px;
        margin: 1rem auto 0.9rem;
      }
      .arriving-badge {
        padding: 0.6rem 1.2rem;
        letter-spacing: 0.2em;
      }
      .big-message {
        font-size: clamp(1.5rem, 7vw, 2.2rem);
      }
      .meta-note {
        gap: 0.8rem 1.4rem;
      }
    }

    /* respect reduced motion */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="hero">
    <!-- Clean, positive FRONTHYRE title (no glow) -->
    <h1 class="big-title">FRONTHYRE</h1>

    <!-- Tagline -->
    <div class="tagline">where technology and talent meets</div>

    <!-- In progress + Something big is arriving -->
    <div class="progress-section">
      <div class="arriving-badge">In progress</div>
      <div class="big-message">Something big is arriving for you</div>

      <div class="progress-track">
        <div class="progress-fill"></div>
      </div>
      <div class="progress-label">building the future</div>
    </div>

    <!-- Footnote: job portal · hackathon · technologists -->
    <div class="meta-note">
      <span>Job portal</span>
      <span>Hackathon</span>
      <span>For technologists</span>
    </div>
  </div>
</body>
</html>
